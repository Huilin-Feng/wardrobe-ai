server {
    listen 80;
    server_name _;

    # Default is 1 MB; clothing photos are larger than that.
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the backend container over Docker's internal network.
    # The trailing slash strips the /api prefix: /api/items -> /items
        # The backend already namespaces its routes under /api and serves images
    # from /uploads, so forward both prefixes unchanged.
    location ~ ^/(api|uploads)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Vision + LLM calls can be slow.
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}