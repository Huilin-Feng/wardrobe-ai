# Production overrides, layered on top of compose.yaml by deploy/deploy.sh:
#   docker compose -f compose.yaml -f deploy/compose.prod.yaml [-f deploy/compose.https.yaml] ...
#
# Differences from local development:
#   - images come from ECR, tagged with the git commit SHA (never built on the server)
#   - container logs go to CloudWatch Logs
#   - configuration comes from .env, which deploy.sh renders from Parameter Store
#
# Relative paths resolve against the directory of compose.yaml (the repo root).
services:
  api:
    image: ${ECR_REGISTRY}/wardrobe-ai-api:${IMAGE_TAG}
    env_file: .env
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${LOG_GROUP}
        awslogs-stream: api

  web:
    image: ${ECR_REGISTRY}/wardrobe-ai-web:${IMAGE_TAG}
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: ${LOG_GROUP}
        awslogs-stream: web
