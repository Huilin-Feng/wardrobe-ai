name: Deploy

# Runs after the CI workflow succeeds on a push to main, or manually from the
# Actions tab. A manual run accepts an older commit SHA, which is how a rollback works.
on:
  workflow_run:
    workflows: ["CI"] # must match the `name:` at the top of ci.yml
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to deploy (empty = latest main). Use an older SHA to roll back."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # only used when OIDC is enabled (vars.AWS_DEPLOY_ROLE_ARN set)

# Never run two deploys at once; queue the newer one instead of cancelling mid-deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  API_REPOSITORY: wardrobe-ai-api
  WEB_REPOSITORY: wardrobe-ai-web
  DEPLOY_DOCUMENT: wardrobe-ai-deploy

jobs:
  deploy:
    # Skipped until the new infrastructure exists (repository variable set).
    # workflow_run must come from a push to this repository: a fork's pull
    # request on a branch that happens to be named "main" must never deploy.
    if: >-
      vars.EC2_INSTANCE_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      # Preferred: OIDC, short-lived credentials and nothing stored in GitHub.
      - name: Get AWS credentials through OIDC
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Fallback while the account's service control policy blocks OIDC providers:
      # a CI-only IAM user with the same least-privilege policy (infra/iam.tf).
      - name: Get AWS credentials from the CI user's access key
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable, so an image for a given commit can be pushed only once.
      # Re-runs and rollbacks reuse existing images instead of rebuilding them.
      - name: Check for existing images
        id: existing
        run: |
          exists() {
            aws ecr describe-images --repository-name "$1" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1 \
              && echo true || echo false
          }
          echo "api=$(exists "$API_REPOSITORY")" >> "$GITHUB_OUTPUT"
          echo "web=$(exists "$WEB_REPOSITORY")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.existing.outputs.api == 'false' || steps.existing.outputs.web == 'false'
        uses: docker/setup-buildx-action@v3

      # Built on GitHub's x86_64 runners to match the t3 instance. Images built on
      # an Apple Silicon Mac would be arm64 and fail to start on the server.
      - name: Build and push the API image
        if: steps.existing.outputs.api == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          provenance: false # one plain image manifest per tag keeps ECR easy to read
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.API_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the web image
        if: steps.existing.outputs.web == 'false'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          provenance: false
          # Empty means same origin: nginx forwards /api and /uploads to the backend.
          build-args: |
            VITE_API_URL=
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.WEB_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Deploy on the server through SSM Run Command
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DEPLOY_DOCUMENT" \
            --parameters "CommitSha=$IMAGE_TAG" \
            --comment "Deploy ${IMAGE_TAG:0:7}" \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $command_id"

          status="Pending"
          for attempt in $(seq 1 60); do
            sleep 10
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo "Pending")
            echo "[$attempt] $status"
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "----- output from the server -----"
          aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query "[StandardOutputContent, StandardErrorContent]" --output text || true

          test "$status" = "Success"

      - name: Smoke test the public site
        if: vars.PUBLIC_URL != ''
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            "${{ vars.PUBLIC_URL }}/api/health"
